[pytest]
# smoke_test_core.py and part3b_extra_tests.py don't match pytest's default
# python_files pattern (test_*.py / *_test.py), so `pytest tests/` silently
# collected 0 items via directory-mode discovery even though both files run
# fine when named explicitly. Widening the pattern here fixes `pytest tests/`
# without renaming files that are already cited by name throughout the report.
python_files = test_*.py *_test.py smoke_test_core.py part3b_extra_tests.py
